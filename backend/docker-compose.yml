services:
  ime-weather-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ime_weather_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      LOG_LEVEL: "info"
      CACHE_TTL_MINUTES: "45"
      NODE_ENV: "production"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
