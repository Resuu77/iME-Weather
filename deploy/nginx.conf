################################################################################
# Nginx reverse proxy configuration for iME Weather backend
#
# This file is OPTIONAL. Use it if you have Nginx installed on your VPS
# and want to proxy port 80/443 → 3000, or add SSL via Let's Encrypt.
#
# Installation:
#   sudo cp nginx.conf /etc/nginx/sites-available/ime-weather
#   sudo ln -s /etc/nginx/sites-available/ime-weather /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
################################################################################

upstream ime_weather_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;  # e.g. weather.yourdomain.com

    # Redirect to HTTPS once you have a certificate
    # return 301 https://$host$request_uri;

    location /api/ {
        proxy_pass         http://ime_weather_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    10s;

        # Cache headers pass-through
        proxy_pass_header   X-Cache;
        proxy_pass_header   X-Cache-Key;
    }

    # Block everything else
    location / {
        return 404;
    }
}

