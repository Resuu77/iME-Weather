name: Build and Release to Public Repo

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Generate l10n
        working-directory: mobile
        run: flutter gen-l10n

      - name: Build Hive adapters
        working-directory: mobile
        run: flutter pub run build_runner build --delete-conflicting-outputs

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --release

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ime-weather-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish APK to Public Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          repository: Cloxoff/iME-Weather
          files: mobile/build/app/outputs/flutter-apk/app-release.apk
          name: iME Weather ${{ github.ref_name }} — Initial Release
          tag_name: ${{ github.ref_name }}
          body: |
            ## 📱 iME Weather ${{ github.ref_name }}

            Мобильное приложение для отслеживания погоды в Туркменистане.

            ### ✨ Возможности:
            - Точный прогноз погоды в реальном времени
            - Почасовой прогноз и прогноз на 7 дней
            - Полная база городов велаятов Туркменистана
            - Поддержка трех языков (TK / RU / EN)
            - Офлайн-кэширование данных (Hive)

            ### 📥 Установка:
            Скачайте прикрепленный файл `app-release.apk` ниже и установите на Android.
        env:
          GITHUB_TOKEN: ${{ secrets.PUBLIC_RELEASE_TOKEN }}