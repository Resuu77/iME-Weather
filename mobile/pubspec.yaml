name: ime_weather
description: iME Weather — Turkmenistan weather app with Liquid Glass design
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Networking
  http: ^1.2.1

  # Local storage
  hive_flutter: ^1.1.0

  # Location
  geolocator: ^12.0.0
  permission_handler: ^11.3.1

  # Animations
  flutter_animate: ^4.5.0

  # Internationalisation
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true   # enables flutter gen-l10n from l10n.yaml

